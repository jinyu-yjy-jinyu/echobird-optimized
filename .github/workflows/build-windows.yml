name: Build Windows installer

# Windows x64 exe distribution for this repository.
#
# The upstream Release workflow builds 5 platform bundles, expects code-signing
# and China-mirror secrets, and only runs on `v*` tags. This one is deliberately
# minimal so it works in a fork with no secrets configured: it produces the
# NSIS installer (EchoBird_<version>_x64-setup.exe) and attaches it to a release.
# The installer is UNSIGNED — Windows SmartScreen will warn on first run.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v6.2.3)'
        required: true
        type: string
      publish:
        description: 'Publish the release (unchecked = draft, you publish manually)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-windows-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # rust-toolchain.toml pins 1.93.0; install it explicitly so the first
      # cargo invocation doesn't have to bootstrap a toolchain mid-build.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ runner.os }}-tauri

      - name: Install npm dependencies
        run: npm ci

      # Cheap gate: a type error here would waste a 20-minute Rust build.
      - name: Typecheck
        run: npm run typecheck

      - name: Build Tauri app
        run: npm run tauri -- build --bundles nsis
        env:
          CI: true

      - name: Check the installer exists
        shell: pwsh
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $installers) { throw "No NSIS installer was produced" }
          $installers | ForEach-Object { "{0} ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: echobird-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No installer produced" }

          gh release view $env:TAG 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)

          if ($exists) {
            gh release upload $env:TAG $assets --clobber
          } else {
            $notes = "Windows x64 installer built from commit ${{ github.sha }} by GitHub Actions.`n`nUnsigned build: Windows SmartScreen may warn on first run.`nRequires the Microsoft Edge WebView2 runtime (bundled with Windows 11 and current Windows 10)."
            $ghArgs = @('release', 'create', $env:TAG) + $assets + @('--target', '${{ github.sha }}', '--title', "EchoBird $env:TAG", '--notes', $notes)
            if ($env:PUBLISH -eq 'true') { $ghArgs += '--latest' } else { $ghArgs += '--draft' }
            gh $ghArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release command failed" }

          gh release view $env:TAG --json url,isDraft,assets --jq '"release: \(.url) draft=\(.isDraft)", (.assets[] | "  asset: \(.name) (\(.size) bytes)")'
