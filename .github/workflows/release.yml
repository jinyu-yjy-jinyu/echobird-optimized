name: Release

# All-platform release pipeline for this fork.
#
# Fork differences from upstream:
#   * No code-signing / notarisation / China-mirror secrets. macOS and Windows
#     artefacts are therefore UNSIGNED (the publish step says so in the notes).
#   * One workflow owns release creation. build-windows.yml was removed so two
#     workflows can never race for the same release object.
#   * `push: tags` is intentionally not a trigger: a tag alone would start a
#     ~40 minute five-platform build without anyone choosing to publish.
#
# Artifacts produced:
#   Windows x64         nsis .exe + .msi
#   macOS arm64 / x64   .dmg
#   Linux x64 / arm64   .deb + .rpm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v6.2.5 (must match the version in tauri.conf.json)'
        required: true
        type: string
      publish:
        description: 'Publish the release once every platform has built'
        type: boolean
        default: true
      only:
        description: 'Build every platform (all), or a single target triple to fill a gap'
        type: string
        default: all

# Never let two runs upload to the same tag at once.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    # Cheap gate: fail on a type error or a version/tag mismatch before burning
    # five runners and ~40 minutes of Rust compilation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify the tag matches the bundled version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vX.Y.Z"; exit 1
          fi
          BUNDLED=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${TAG#v}" != "$BUNDLED" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $BUNDLED"; exit 1
          fi
          echo "Building EchoBird $BUNDLED from $TAG"

      - run: npm ci

      - run: npm run typecheck

  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      # Create ONE draft release up front so the matrix jobs below all upload
      # to the same object. Draft releases are not returned by the
      # releases/tags/{tag} lookup, so the parallel jobs must be handed an id
      # rather than each trying to create a release of its own.
      - name: Create (or reuse) the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # `gh release view` fails for a tag with no release yet, so only treat
          # a successful lookup as authoritative.
          if gh release view "$TAG" --repo "$REPO" --json isDraft -q .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::$TAG is already published; bump the version instead of overwriting it"; exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" --json isDraft >/dev/null 2>&1; then
            echo "reusing existing draft release $TAG"
          else
            # Let gh build the request: the REST `draft` field is a boolean and
            # `gh api -f draft=true` would send the string "true", which the
            # API rejects with 422.
            gh release create "$TAG" --repo "$REPO" --draft \
              --title "EchoBird ${TAG#v} · 非官方优化版" \
              --notes "All-platform build in progress."
            echo "created draft release $TAG"
          fi
          gh release view "$TAG" --repo "$REPO" --json databaseId -q .databaseId > /tmp/release_id
          echo "release_id=$(cat /tmp/release_id)" >> "$GITHUB_OUTPUT"

  plan:
    # The platform list lives here so a failed target can be rebuilt on its own
    # (workflow input `only`) instead of re-running all five. Job-level `if`
    # cannot see `matrix`, so the matrix itself is filtered here.
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          platforms = [
              {"platform": "windows-latest", "rust-target": "x86_64-pc-windows-msvc",
               "args": "--bundles nsis,msi"},
              # Both macOS slices are built from the arm64 image: the Apple SDK
              # is universal, so one runner yields arm64 and x64 installers.
              {"platform": "macos-26", "rust-target": "aarch64-apple-darwin",
               "args": "--target aarch64-apple-darwin --bundles dmg"},
              {"platform": "macos-26", "rust-target": "x86_64-apple-darwin",
               "args": "--target x86_64-apple-darwin --bundles dmg"},
              # deb + rpm only. An AppImage would carry its own webkit/gtk
              # runtime (~80 MB); deb/rpm use the system webkit2gtk (~11 MB).
              {"platform": "ubuntu-24.04", "rust-target": "x86_64-unknown-linux-gnu",
               "args": "--bundles deb,rpm"},
              {"platform": "ubuntu-24.04-arm", "rust-target": "aarch64-unknown-linux-gnu",
               "args": "--bundles deb,rpm"},
          ]

          only = (os.environ.get("ONLY") or "all").strip()
          if only not in ("all", ""):
              known = {entry["rust-target"] for entry in platforms}
              if only not in known:
                  sys.exit(f"unknown target '{only}'; expected all or one of {sorted(known)}")
              platforms = [entry for entry in platforms if entry["rust-target"] == only]

          print("matrix=" + json.dumps({"include": platforms}))
          PY

  build:
    needs: [preflight, create-release, plan]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Pinned to the same channel as rust-toolchain.toml. The two must match
      # exactly: `1.93` and `1.93.0` resolve to different toolchain directories,
      # so rustup would install the cross target into a toolchain the build
      # never uses ("Target x86_64-apple-darwin is not installed").
      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@1.120.0

      # rust-toolchain.toml overrides the default toolchain inside the repo, so
      # the extra target has to be added for whichever toolchain is active here.
      - name: Add the cross-compilation target
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.rust-target }}"
          rustup target list --installed
          rustc --version

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.rust-target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libasound2-dev libxkbcommon-dev \
            rpm

      - name: Report macOS SDK
        if: runner.os == 'macOS'
        run: echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version) on $(uname -m)"

      - run: npm ci

      # ANTIGRAVITY_OAUTH_* are read through option_env! with an empty-string
      # fallback, so the build is reproducible without any repository secret.
      - name: Build the app
        shell: bash
        run: npm run tauri -- build ${{ matrix.args }}

      - name: Stage installers with platform-labelled names
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, shutil
          from pathlib import Path

          target = os.environ['RUST_TARGET']
          version = os.environ['TAG'].lstrip('v')
          arch = 'arm64' if target.startswith('aarch64') else 'x64'
          if 'windows' in target:
              formats = {'exe': f'Windows_{arch}-setup.exe', 'msi': f'Windows_{arch}.msi'}
          elif 'darwin' in target:
              formats = {'dmg': f'macOS_{arch}.dmg'}
          else:
              formats = {'deb': f'Linux_{arch}.deb', 'rpm': f'Linux_{arch}.rpm'}

          bundled = Path('src-tauri/target')
          candidates = [bundled / target / 'release/bundle', bundled / 'release/bundle']
          bundle = next((p for p in candidates if p.exists()), None)
          if bundle is None:
              raise SystemExit('no bundle directory produced by the build')

          out = Path(os.environ['RUNNER_TEMP']) / 'echobird-installers'
          out.mkdir(exist_ok=True)
          for extension, suffix in formats.items():
              files = list(bundle.rglob('*.' + extension))
              if len(files) != 1:
                  raise SystemExit(f'expected one .{extension} installer, found {len(files)}')
              if files[0].stat().st_size == 0:
                  raise SystemExit(f'empty .{extension} installer')
              name = f'EchoBird_{version}_{suffix}'
              shutil.copy2(files[0], out / name)
              print(name, files[0].stat().st_size)
          PY

      - name: Upload installers to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/echobird-installers/*)
          test ${#files[@]} -gt 0
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "upload failed, retrying in 10s"; sleep 10
          done
          gh release view "$TAG" --repo "$REPO" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes"'

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest \
            --notes "$(cat <<'NOTES'
          > [!IMPORTANT]
          > **非官方优化版，不是原项目。Unofficial optimized build — not the official project.**
          > 本仓库仅在 [EchoBird](https://github.com/edison7009/EchoBird) 原版基础上做安全 / 稳定性 / 性能修复后重新构建，
          > 不新增功能、不代表原作者观点、未获背书。
          > **官方原版（唯一官方来源）→ https://github.com/edison7009/EchoBird**

          All-platform build from this repository, produced by GitHub Actions.

          | Platform | Architecture | Installer |
          | --- | --- | --- |
          | Windows | x64 | `.exe` (NSIS), `.msi` |
          | macOS | Apple silicon | `.dmg` |
          | macOS | Intel | `.dmg` |
          | Linux | x64 | `.deb`, `.rpm` |
          | Linux | arm64 | `.deb`, `.rpm` |

          These builds are **unsigned**. Windows SmartScreen shows "unknown
          publisher" (More info -> Run anyway). macOS Gatekeeper refuses the
          first launch; clear the quarantine flag once:

          ```bash
          xattr -dr com.apple.quarantine /Applications/EchoBird.app
          ```

          Windows builds need the WebView2 runtime (bundled with Windows 11 and
          current Windows 10); Linux builds need webkit2gtk 4.1.
          NOTES
          )"
          gh release view "$TAG" --repo "$REPO" --json url,isDraft,assets \
            --jq '"release: \(.url) draft=\(.isDraft)", (.assets[] | "  \(.name)  \(.size) bytes")'
